name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch the prebuilt map data
        run: node scripts/fetch-dev-assets.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch vendored runtime assets
        run: node scripts/fetch-app-assets.mjs

      - name: Draw the home-screen icons
        run: node scripts/build-icons.mjs

      - name: Build the map style
        run: node scripts/build-style.mjs

      - name: Build the quiz data
        run: node scripts/build-quiz.mjs

      - name: Test
        run: node --test 'test/*.test.mjs'

      - name: Assemble the site
        run: node scripts/build-site.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
