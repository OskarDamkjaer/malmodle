name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  map-data:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    concurrency:
      group: map-data
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Find the pinned release
        id: release
        run: |
          tag=$(sed -n "s/^const TAG = '\(.*\)';$/\1/p" scripts/fetch-dev-assets.mjs)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.release.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - if: steps.release.outputs.exists == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install osmium
        if: steps.release.outputs.exists == 'false'
        run: sudo apt-get update && sudo apt-get install -y osmium-tool

      - name: Build the map data
        if: steps.release.outputs.exists == 'false'
        run: |
          scripts/build-basemap.sh
          node scripts/build-districts.mjs
          node scripts/build-streets.mjs
          node scripts/build-shapes.mjs
          node scripts/build-quiz.mjs

      - name: Publish the map data
        if: steps.release.outputs.exists == 'false'
        run: |
          tar --sort=name --owner=0 --group=0 --numeric-owner -czf dev-assets.tar.gz \
            build/data/districts.geojson data/cache/malmo.pmtiles data/cache/streets.json \
            data/cache/shapes.json
          sha256sum dev-assets.tar.gz | cut -d' ' -f1 > dev-assets.tar.gz.sha256
          gh release create "${{ steps.release.outputs.tag }}" dev-assets.tar.gz dev-assets.tar.gz.sha256 \
            --prerelease --title "${{ steps.release.outputs.tag }}" \
            --notes "Map data for the quiz build: delområde polygons, the basemap archive and the street index."

  build:
    needs: map-data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch the prebuilt map data
        run: node scripts/fetch-dev-assets.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch vendored runtime assets
        run: node scripts/fetch-app-assets.mjs

      - name: Draw the home-screen icons
        run: node scripts/build-icons.mjs

      - name: Build the map style
        run: node scripts/build-style.mjs

      - name: Build the quiz data
        run: node scripts/build-quiz.mjs

      - name: Test
        run: node --test 'test/*.test.mjs'

      - name: Assemble the site
        run: node scripts/build-site.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: build/site
          retention-days: 1

  cloudflare:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: build/site

      - name: Migrate the database
        run: npx --yes wrangler@4 d1 migrations apply malmodle --remote

      - name: Deploy
        run: npx --yes wrangler@4 deploy

  pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
