name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  map-data:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: write
    concurrency:
      group: map-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Find the release for these inputs
        id: release
        run: |
          tag=$(node -e "import('./scripts/lib/dev-assets.mjs').then((m) => console.log(m.devAssetsTag()))")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.release.outputs.exists == 'false'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install osmium
        if: steps.release.outputs.exists == 'false'
        run: sudo apt-get update && sudo apt-get install -y osmium-tool

      - name: Build the map data
        if: steps.release.outputs.exists == 'false'
        run: |
          scripts/build-basemap.sh
          node scripts/build-districts.mjs
          node scripts/build-streets.mjs
          node scripts/build-shapes.mjs
          node scripts/build-quiz.mjs

      - name: Publish the map data
        if: steps.release.outputs.exists == 'false'
        run: |
          tar --sort=name --owner=0 --group=0 --numeric-owner -czf dev-assets.tar.gz \
            build/data/districts.geojson data/cache/malmo.pmtiles data/cache/streets.json \
            data/cache/shapes.json
          sha256sum dev-assets.tar.gz | cut -d' ' -f1 > dev-assets.tar.gz.sha256
          gh release create "${{ steps.release.outputs.tag }}" dev-assets.tar.gz dev-assets.tar.gz.sha256 \
            --prerelease --title "${{ steps.release.outputs.tag }}" \
            --notes "Map data for the quiz build: delområde polygons, the basemap archive and the street index."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: map-data
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Fetch the prebuilt map data
        run: node scripts/fetch-dev-assets.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch vendored runtime assets
        run: node scripts/fetch-app-assets.mjs

      - name: Draw the home-screen icons
        run: node scripts/build-icons.mjs

      - name: Build the map style
        run: node scripts/build-style.mjs

      - name: Build the quiz data
        run: node scripts/build-quiz.mjs

      - name: Install the tools
        run: npm ci --no-fund --no-audit

      - name: Test
        shell: bash
        run: |
          node --test --test-reporter=tap 'test/*.test.mjs' | tee test.log
          if grep '# SKIP' test.log; then
            echo '::error::tests skipped before a release'
            exit 1
          fi

      - name: Assemble the site
        run: node scripts/build-site.mjs

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: build/site
          retention-days: 1

  cloudflare:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    concurrency:
      group: cloudflare
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: build/site

      - name: Install the tools
        run: npm ci --no-fund --no-audit

      - name: Migrate the database
        run: npx wrangler d1 migrations apply malmodle --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  live:
    needs: [cloudflare, pages]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: build/site

      - name: Install the tools
        run: npm ci --no-fund --no-audit

      - name: Check the live sites
        shell: bash
        run: |
          node --test --test-reporter=tap 'test/live/*.test.mjs' | tee live.log
          if grep '# SKIP' live.log | grep -v '# SKIP no API here'; then
            echo '::error::live checks skipped'
            exit 1
          fi
        env:
          SITES: https://malmodle.se https://malmoe.damk.eu
          BUILD: build/site

  pages:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
