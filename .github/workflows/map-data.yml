name: Map data

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example dev-assets-v4
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install osmium
        run: sudo apt-get update && sudo apt-get install -y osmium-tool

      - name: Build the basemap
        run: scripts/build-basemap.sh

      - name: Build the delområden
        run: node scripts/build-districts.mjs

      - name: Build the street index
        run: node scripts/build-streets.mjs

      - name: Check that the quiz builds from it
        run: node scripts/build-quiz.mjs

      - name: Package
        run: |
          tar --sort=name --owner=0 --group=0 --numeric-owner -czf dev-assets.tar.gz \
            build/data/districts.geojson data/cache/malmo.pmtiles data/cache/streets.json
          sha256sum dev-assets.tar.gz | cut -d' ' -f1 > dev-assets.tar.gz.sha256
          echo "tag: ${{ inputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "sha256: $(cat dev-assets.tar.gz.sha256)" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish
        run: |
          gh release create "${{ inputs.tag }}" dev-assets.tar.gz dev-assets.tar.gz.sha256 \
            --prerelease --title "${{ inputs.tag }}" \
            --notes "Map data for the quiz build: delområde polygons, the basemap archive and the street index."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
