name: Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Fetch the prebuilt map data
        run: node scripts/fetch-dev-assets.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch vendored runtime assets
        run: node scripts/fetch-app-assets.mjs

      - name: Draw the home-screen icons
        run: node scripts/build-icons.mjs

      - name: Build the map style
        run: node scripts/build-style.mjs

      - name: Build the quiz data
        run: node scripts/build-quiz.mjs

      - name: Install the tools
        run: npm ci --no-fund --no-audit

      - name: Test
        shell: bash
        run: |
          node --test --test-reporter=tap 'test/*.test.mjs' | tee test.log
          if grep '# SKIP' test.log; then
            echo '::error::tests skipped'
            exit 1
          fi

      - name: Assemble the site
        run: node scripts/build-site.mjs
