<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slutlig bild</title>
<style>
  :root { --bg: #f6f5f2; --fg: #1d1d1b; --muted: #6b6a66; --card: #fff; --line: #dcdad4; --ok: #1f7a4d; --no: #b42318; --accent: #2b5fb4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171716; --fg: #ecebe7; --muted: #9b9a95; --card: #232321; --line: #3a3936; --ok: #4cc38a; --no: #f97066; --accent: #7aa7f0; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, sans-serif; display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 20px; }
  header .label { color: var(--muted); }
  header .progress { margin-left: auto; color: var(--muted); font-size: 13px; }
  main { flex: 1; min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; }
  .photo { position: relative; min-height: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  .photo img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .photo .status { position: absolute; top: 12px; left: 12px; padding: 4px 10px; border-radius: 999px; font-weight: 600; color: #fff; }
  .photo .status.ok { background: var(--ok); }
  .photo .status.no { background: var(--no); }
  .photo .alt { position: absolute; top: 12px; right: 12px; padding: 4px 10px; border-radius: 999px; background: rgb(0 0 0 / 0.6); color: #fff; font-size: 13px; }
  .photo .empty { color: #ccc; padding: 24px; text-align: center; }
  .info { padding: 10px 16px 12px; display: grid; gap: 6px; }
  .about { max-width: 70ch; font-size: 17px; }
  .about.missing { font-size: 14px; color: var(--muted); font-style: italic; }
  .credit, .why { color: var(--muted); font-size: 13px; }
  .credit a { color: var(--accent); }
  .buttons { display: flex; flex-wrap: wrap; gap: 8px; }
  button { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  button.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
  button.no { border-color: var(--no); color: var(--no); }
  kbd { font-size: 11px; opacity: 0.7; margin-left: 4px; }
</style>
</head>
<body>
<header>
  <h1 id="name"></h1><span class="label" id="label"></span>
  <span class="progress" id="progress"></span>
</header>
<main>
  <div class="photo" id="photo"></div>
  <div class="info">
    <div class="about" id="about"></div>
    <div class="credit" id="credit"></div>
    <div class="why" id="why"></div>
    <div class="buttons">
      <button class="ok" id="ok">Godkänn<kbd>Enter</kbd></button>
      <button id="prevAlt">Föregående<kbd>←</kbd></button>
      <button id="nextAlt">Nästa förslag<kbd>→</kbd></button>
      <button class="no" id="none">Ingen duger<kbd>X</kbd></button>
      <button id="prevPlace">Förra platsen<kbd>↑</kbd></button>
      <button id="nextPlace">Nästa plats<kbd>↓</kbd></button>
    </div>
  </div>
</main>
<script type="module">
const queue = (await (await fetch('/queue')).json()).items;
let picks = await (await fetch('/picks')).json();
const $ = (id) => document.getElementById(id);
const decided = (q) => picks[q.key]?.approved === true || picks[q.key]?.approved === false;
let index = Math.max(0, queue.findIndex((q) => !decided(q)));
let alt = 0;

const src = (p) => p.thumb ?? `/thumb/${p.source}/${p.id}`;
const entry = (q) => (picks[q.key] ??= { photos: [], reviewed: false });

function startAlt(q) {
  const f = picks[q.key]?.final;
  const i = q.alternatives.findIndex((a) => a.id === f);
  return i >= 0 ? i : 0;
}

for (const q of queue) for (const a of q.alternatives.slice(0, 2)) new Image().src = src(a);

async function save() {
  await fetch('/picks', { method: 'POST', body: JSON.stringify(picks) });
}

function render() {
  const q = queue[index];
  const a = q.alternatives[alt];
  const e = picks[q.key];
  $('name').textContent = q.name;
  $('label').textContent = `${q.label ?? q.kind} · i spelet från ${q.first}`;
  const done = queue.filter(decided).length;
  const ok = queue.filter((x) => picks[x.key]?.approved === true).length;
  $('progress').textContent = `${index + 1} av ${queue.length} · ${done} avgjorda · ${ok} godkända`;
  const status = e?.approved === true && e.final === a?.id ? '<span class="status ok">Godkänd</span>'
    : e?.approved === false ? '<span class="status no">Ingen duger</span>' : '';
  $('photo').innerHTML = a
    ? `<img src="${src(a)}" alt="">${status}<span class="alt">${alt + 1} / ${q.alternatives.length}</span>`
    : `<div class="empty">Inga förslag för den här platsen.</div>${status}`;
  $('about').textContent = q.about ?? (q.note ? `Ingen beskrivning än. Anteckning: ${q.note}` : 'Ingen beskrivning än.');
  $('about').classList.toggle('missing', !q.about);
  $('credit').innerHTML = a ? `Foto: ${a.author ?? 'okänd'}, ${a.licence} · ${a.captured ?? ''} · <a href="${a.url}" target="_blank" rel="noopener">källa</a>${a.title ? ` · ${a.title}` : ''}` : '';
  $('why').textContent = a?.why ?? '';
  for (const n of [1, 2]) { const next = q.alternatives[alt + n]; if (next) new Image().src = src(next); }
}

function go(i) {
  index = (i + queue.length) % queue.length;
  alt = startAlt(queue[index]);
  render();
}

function nextUndecided() {
  const after = queue.findIndex((q, i) => i > index && !decided(q));
  const any = queue.findIndex((q) => !decided(q));
  go(after >= 0 ? after : any >= 0 ? any : index);
}

async function approve() {
  const q = queue[index];
  const a = q.alternatives[alt];
  if (!a) return;
  const e = entry(q);
  const { why, ...photo } = a;
  if (!e.photos.some((p) => p.id === a.id)) e.photos.unshift(photo);
  e.final = a.id;
  e.approved = true;
  await save();
  nextUndecided();
}

async function none() {
  const e = entry(queue[index]);
  e.final = null;
  e.approved = false;
  await save();
  nextUndecided();
}

function step(n) {
  const q = queue[index];
  if (!q.alternatives.length) return;
  alt = (alt + n + q.alternatives.length) % q.alternatives.length;
  render();
}

$('ok').addEventListener('click', approve);
$('none').addEventListener('click', none);
$('nextAlt').addEventListener('click', () => step(1));
$('prevAlt').addEventListener('click', () => step(-1));
$('nextPlace').addEventListener('click', () => go(index + 1));
$('prevPlace').addEventListener('click', () => go(index - 1));
document.addEventListener('keydown', (ev) => {
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const k = ev.key;
  if (k === 'Enter') approve();
  else if (k === 'ArrowRight' || k === ' ') step(1);
  else if (k === 'ArrowLeft') step(-1);
  else if (k === 'x' || k === 'X' || k === 'Backspace') none();
  else if (k === 'ArrowDown') go(index + 1);
  else if (k === 'ArrowUp') go(index - 1);
  else return;
  ev.preventDefault();
});
alt = startAlt(queue[index]);
render();
</script>
</body>
</html>
