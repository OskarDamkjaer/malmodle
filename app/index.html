<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Lär dig Malmö</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="description" content="Tio platser i Malmö om dagen. Hitta dem på kartan.">
<meta name="theme-color" content="#f8f4f0">
<meta name="color-scheme" content="light">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="stylesheet" href="/vendor/maplibre-gl.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="map"></div>

<section id="question" class="panel" data-edge="top" hidden>
  <div class="row">
    <span id="progress"></span>
    <span id="detail"></span>
  </div>
  <h1 id="prompt"></h1>
</section>

<section id="choices" class="panel" data-edge="bottom" hidden></section>

<section id="result" class="panel" data-edge="bottom" role="status" hidden>
  <div class="row">
    <strong id="points"></strong>
    <span id="verdict"></span>
  </div>
  <p id="explain"></p>
  <button id="next" type="button" class="primary">Nästa</button>
</section>

<section id="end" hidden>
  <div class="sheet">
    <header>
      <p id="enddate"></p>
      <h1 id="endscore"></h1>
      <p id="endsquares" aria-hidden="true"></p>
    </header>
    <div class="actions">
      <button id="share" type="button" class="primary">Kopiera resultat</button>
      <button id="openmap" type="button">Utforska kartan</button>
      <button id="again" type="button">Spela igen</button>
    </div>
    <ol id="endlist"></ol>
  </div>
</section>

<button id="back" type="button" class="panel" data-edge="top" hidden>Dagens resultat</button>

<section id="card" class="panel" data-edge="bottom" hidden>
  <h2 id="cardname"></h2>
  <p id="cardlabel"></p>
  <p id="cardabout"></p>
  <a id="cardsource" target="_blank" rel="noopener" hidden>Källa</a>
</section>

<div id="boot"><p id="bootmsg">Laddar kartan…</p></div>

<script src="/vendor/pmtiles.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
