<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Malmödle</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="description" content="Tio platser i Malmö om dagen. Hitta dem på kartan.">
<meta name="theme-color" content="#f4f1ea">
<meta property="og:title" content="Malmödle">
<meta property="og:description" content="Tio platser i Malmö om dagen. Hitta dem på kartan.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://malmodle.se/">
<meta property="og:image" content="https://malmodle.se/icons/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Turning Torso, vitt mot blått">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="stylesheet" href="/vendor/maplibre-gl.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="map"></div>
<div id="aim" aria-hidden="true"></div>
<p id="aimhint">Flytta kartan med piltangenterna, zooma med + och −, svara med Enter.</p>

<section id="question" class="panel" data-edge="top" hidden>
  <div class="row">
    <ol id="dots"></ol>
    <span id="detail"></span>
  </div>
  <h1 id="prompt"></h1>
</section>


<section id="choices" class="panel" data-edge="bottom" hidden></section>

<section id="result" class="panel" data-edge="bottom" role="status" hidden>
  <div class="row">
    <p class="score"><strong id="points" class="band"></strong><span>poäng</span></p>
    <p id="verdict"></p>
  </div>
  <p id="explain"></p>
  <button id="next" type="button" class="primary">Nästa</button>
</section>

<aside id="info" class="panel" data-edge="side" hidden>
  <button id="infoclose" type="button" aria-label="Stäng">×</button>
  <figure id="infophoto"></figure>
  <div class="text">
    <p id="infolabel"></p>
    <h2 id="infoname"></h2>
    <p id="infoscore" hidden><span id="infopoints" class="band"></span><span id="infooutcome"></span></p>
    <p id="infoabout"></p>
    <p id="infolinks"><a id="infosource" target="_blank" rel="noopener">Läs mer</a><a id="infostreet" target="_blank" rel="noopener">Gatuvy</a></p>
  </div>
</aside>

<section id="end" hidden>
  <div class="sheet" data-edge="left">
    <header>
      <p class="masthead">Malmödle</p>
      <p id="enddate"></p>
      <p class="total"><strong id="endscore"></strong><span id="endmax"></span></p>
      <p id="endverdict"></p>
      <p id="elsewhere" hidden><a id="elsewherelink">Spela på malmodle.se</a> för mer statistik.</p>
    </header>
    <div id="crowd" hidden></div>
    <div class="round">
      <div id="endsquares" class="squares"></div>
      <div id="sharecard" class="shareactions">
        <button id="share" type="button" class="primary">Kopiera resultat</button>
        <button id="sharenative" type="button" hidden>Dela</button>
      </div>
    </div>
    <div class="actions">
      <button id="practise" type="button" aria-expanded="false" aria-controls="kinds">Öva</button>
      <button id="again" type="button">Spela igen</button>
    </div>
    <div id="kinds" class="kinds" hidden></div>
    <button id="endmap" type="button">Visa på kartan</button>
    <div id="install" class="install" hidden>
      <p id="installtext"></p>
      <button id="installbutton" type="button" hidden>Installera</button>
    </div>
  </div>
</section>

<div id="mapmenu" class="maplibregl-ctrl">
  <div class="maplibregl-ctrl-group">
    <button id="mapmenubutton" type="button" aria-label="Kartinställningar" aria-expanded="false" aria-controls="mapmenupanel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 21 8l-9 4.5L3 8z"/><path d="m3 12 9 4.5 9-4.5"/><path d="m3 16 9 4.5 9-4.5"/></svg></button>
  </div>
  <div id="mapmenupanel" hidden>
    <p id="styleslabel" class="kicker">Kartstil</p>
    <div id="styles" role="group" aria-labelledby="styleslabel"></div>
    <p id="maptip">Tryck på en plats på kartan för att läsa om den.</p>
    <a id="report" href="https://github.com/OskarDamkjaer/malmodle/issues/new" target="_blank" rel="noopener">Rapportera ett fel</a>
  </div>
</div>

<div id="boot">
  <div class="brand">
    <img class="mark" src="/icons/icon.svg" alt="" width="64" height="64">
    <h1>Malmödle</h1>
    <p>Kan du Malmö?</p>
  </div>
  <div class="bar"><i id="bootbar"></i></div>
  <p id="bootmsg" role="status"></p>
</div>

<script src="/vendor/pmtiles.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
