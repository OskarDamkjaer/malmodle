<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spelet i ram</title>
<link rel="stylesheet" href="/app.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { display: grid; grid-template-rows: auto 1fr; height: 100vh; background: var(--bg); }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 16px; font-size: 14px; border-bottom: var(--border); background: var(--panel); }
  .bar .group { display: flex; gap: 6px; flex-wrap: wrap; }
  .bar button { min-height: 36px; padding: 6px 12px; font-size: 14px; }
  .bar button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
  #stage { position: relative; overflow: hidden; }
  #frame { position: absolute; left: 50%; top: 16px; border: var(--border); box-shadow: var(--shadow); background: var(--bg); transform-origin: top center; }
</style>
</head>
<body>
<div class="bar">
  <div class="group" id="sizes"></div>
  <button id="restart" type="button">Börja om</button>
</div>
<div id="stage"><iframe id="frame" title="Spelet" src="/"></iframe></div>
<script type="module" src="/dev/frame.js"></script>
</body>
</html>
