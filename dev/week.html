<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kommande dagar</title>
<link rel="stylesheet" href="/vendor/maplibre-gl.css">
<link rel="stylesheet" href="/app.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { display: grid; grid-template-columns: 1fr minmax(320px, 400px); grid-template-rows: auto auto 1fr; height: 100vh; }
  .bar { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 16px; font-size: 14px; border-bottom: var(--border); background: var(--panel); }
  .bar input[type="date"], .bar input[type="number"] { font: inherit; padding: 4px 6px; }
  .bar input[type="number"] { width: 4em; }
  .bar .hint { color: var(--ink-soft); }
  #days { grid-column: 1 / -1; display: flex; gap: 0; overflow-x: auto; overflow-y: hidden; border-bottom: var(--border); }
  .day { flex: none; padding: 10px 16px 12px; border-right: var(--border); }
  .day > h2, .day > .sum { position: sticky; left: 16px; width: max-content; }
  .day > h2 { margin: 0 0 2px; font-size: 18px; white-space: nowrap; }
  .day > .sum { margin: 0 0 8px; font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
  .qs { display: flex; gap: 6px; align-items: stretch; }
  #weekmap { grid-column: 1; grid-row: 3; position: relative; }
  #card { grid-column: 2; grid-row: 3; overflow: auto; padding: 10px 16px; border-left: var(--border); background: var(--panel); font-size: 14px; }
  .q { flex: none; display: grid; grid-template-columns: 22px 1fr; grid-auto-rows: min-content; align-content: start; gap: 2px 8px; width: 230px; text-align: left; padding: 8px 10px; margin: 0; min-height: 0; font-size: 14px; line-height: 1.35; box-shadow: none; }
  .q[aria-current="true"] { outline: 3px solid var(--accent); outline-offset: -3px; }
  .q .n { font-weight: 600; color: var(--ink-soft); }
  .q .title { font-weight: 600; }
  .q .meta { grid-column: 2; font-size: 12px; color: var(--ink-soft); }
  .q .flags { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px; }
  .flag { font-size: 11px; padding: 1px 6px; border: 1px solid currentColor; border-radius: 9px; }
  .flag.warn { color: var(--wrong); }
  .flag.note { color: var(--ink-soft); }
  #gain { position: absolute; top: 0; left: 0; z-index: 3; pointer-events: none; padding: 3px 8px; border-radius: 6px; font: 600 13px/1.3 var(--font); background: rgba(20, 20, 20, 0.85); color: #fff; white-space: nowrap; }
  #card h3 { margin: 0 0 2px; font: 600 17px/1.3 var(--font-display); }
  #card p { margin: 4px 0; }
  #card .links { display: flex; gap: 12px; flex-wrap: wrap; }
  #card img { max-width: 160px; max-height: 120px; float: right; margin: 0 0 6px 10px; }
</style>
</head>
<body>
<div class="bar">
  <label>Från <input id="from" type="date"></label>
  <label>Dagar <input id="count" type="number" min="1" max="60" value="8"></label>
  <label><input id="labels" type="checkbox" checked> Kartetiketter</label>
  <label><input id="options" type="checkbox" checked> Visa alternativ</label>
  <label><input id="falloff" type="checkbox" checked> Poäng på kartan</label>
  <span class="hint">← → frågor · ↑ ↓ dagar</span>
</div>
<main id="days"></main>
<div id="weekmap"></div>
<section id="card" hidden></section>
<script src="/vendor/pmtiles.js"></script>
<script type="module" src="/dev/week.js"></script>
</body>
</html>
