<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crowd states</title>
<link rel="stylesheet" href="/app.css">
<style>
  html, body { height: auto; overflow: auto; overscroll-behavior: auto; }
  body { padding: 16px; }
  .state { max-width: var(--width); margin: 0 auto 20px; }
  .state > h3 { margin: 0 0 6px; font: 600 12px/1.3 var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
  .state .crowd { margin: 0; }
  .live { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; }
  .live button { min-height: 36px; padding: 4px 12px; font-size: 14px; }
  @media (min-width: 900px) {
    #states { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 24px 20px; align-items: start; }
    .state { max-width: none; margin: 0; }
  }
</style>
</head>
<body>
<main id="states"></main>
<script type="module" src="/dev/crowd.js"></script>
</body>
</html>
