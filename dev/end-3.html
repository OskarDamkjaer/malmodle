<!doctype html>
<html lang="sv" data-theme="tidning">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slutskärm 3 · Facit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400&display=swap">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/dev/end.css">
<style>
  :root { --font: "Source Sans 3", "Helvetica Neue", Arial, sans-serif; --font-display: "Source Serif 4", Georgia, serif; }

  .mast { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 0 0 8px; border-bottom: var(--rule-strong); }
  .mast .name { margin: 0; font: 600 22px/1 var(--font-display); }
  .mast .dateline { display: flex; gap: 8px; margin: 0; font: 600 11px/1.2 var(--font); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
  .mast .dateline span + span::before { content: "·"; margin-right: 8px; }
  #enddate { margin: 0; font: inherit; letter-spacing: inherit; color: inherit; }

  .lede { margin: 22px 0 0; text-align: center; }
  .lede .total { margin: 0; }
  .lede .total strong { font-size: 60px; font-weight: 500; font-variation-settings: "opsz" 60; }

  .crowd, .facit { margin: 26px 0 0; padding: 14px 0 0; background: none; border: 0; border-top: var(--rule); border-radius: 0; }
  .crowd .best { border-top: var(--rule); }
  .label { margin: 0 0 2px; font: 600 11px/1.2 var(--font); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }

  #endlist { margin: 0; padding: 0; list-style: none; }
  #endlist li { display: grid; grid-template-columns: 20px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: var(--rule); }
  #endlist li:last-child { border-bottom: 0; }
  #endlist .n { font: 600 12px/1 var(--font); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  #endlist .what { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; min-width: 0; }
  #endlist .name { font: 16px/1.3 var(--font-display); }
  #endlist .kind { font: 13px/1.3 var(--font); color: var(--ink-soft); }
  #endlist .pts { display: flex; align-items: center; justify-content: flex-end; gap: 8px; min-width: 52px; font: 600 14px/1 var(--font); font-variant-numeric: tabular-nums; }
  #endlist .pts::before { content: ""; width: 10px; height: 10px; border-radius: 1px; background: var(--band); }

  .sharecard { margin: 22px 0 0; padding: 0; background: none; border: 0; box-shadow: none; }
  #end .actions { margin: 10px 0 28px; }
  #end .actions button { background: none; border: var(--rule); }
</style>
</head>
<body>
<div id="map"></div>
<section id="end">
  <div class="sheet" data-edge="left">
    <header class="mast">
      <p class="name">Malmödle</p>
      <p class="dateline"><span id="enddate"></span><span id="endissue"></span></p>
    </header>
    <div class="lede">
      <p class="total"><strong id="endscore"></strong><span id="endmax"></span></p>
      <p id="endverdict"></p>
      <p id="elsewhere" hidden><a id="elsewherelink" href="#">Spela på malmodle.se</a> för mer statistik.</p>
    </div>
    <div id="crowd" hidden></div>
    <div class="facit">
      <p class="label">Facit</p>
      <ol id="endlist"></ol>
    </div>
    <div id="sharecard" class="sharecard">
      <div class="shareactions">
        <button id="share" type="button" class="primary">Kopiera resultat</button>
        <button id="sharenative" type="button" hidden>Dela</button>
      </div>
    </div>
    <div class="actions">
      <button id="practise" type="button">Öva</button>
      <button id="again" type="button">Spela igen</button>
    </div>
  </div>
</section>
<script type="module" src="/dev/end.js"></script>
</body>
</html>
